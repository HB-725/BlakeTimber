{% extends "inventory/HomePage.html" %}

{% block content %}
<main class="flex-1 w-full px-4 pt-4">
  <div class="mx-auto w-full max-w-2xl space-y-4">
    <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4">
      <div class="flex flex-wrap items-start justify-between gap-3">
        <div class="flex flex-col gap-2">
          <a class="inline-flex items-center gap-1 text-xs font-semibold text-slate-500 hover:text-primary"
            href="{% url 'home-page' %}" data-back-link>
            <span class="material-symbols-outlined text-[16px]">arrow_back</span>
            Back
          </a>
          <div>
            <h2 class="text-xl font-bold text-slate-900 dark:text-white">Ekodeck Calculator</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400">
              Composite decking calculator embedded from Ekodeck.
            </p>
          </div>
        </div>
        <a href="{{ calculator_url }}" target="_blank" rel="noopener"
          class="text-xs font-semibold text-primary hover:text-primary/80">
          Open full page
        </a>
      </div>
    </div>

    <div
      class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
      <iframe src="{{ calculator_url }}" title="Ekodeck Calculator" class="h-[75vh] w-full bg-white" loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </div>
</main>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var backLink = document.querySelector("[data-back-link]");
    if (!backLink) {
      return;
    }
    backLink.addEventListener("click", function (event) {
      if (window.history.length > 1) {
        event.preventDefault();
        window.history.back();
      }
    });
  });
</script>
{% endblock %}
